name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Cancel superseded pull request runs; never cancel a run on main or a
  # scheduled run, whose results are recorded against the default branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: "test:unit"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: make fmt
      - name: Unit tests
        run: make test
      - name: Contract tests
        run: make test-contract
      - name: Integration tests
        run: make test-integration
      - name: Coverage
        run: make coverage
      - name: Race detector
        run: make test-race
      - name: Vet
        run: make vet
      - name: Build
        run: make build
      - name: Documentation
        run: make docs

  # Split out of `quality` so linting reports as its own `lint:go` check,
  # matching the shared required-check set used across the sibling
  # repositories. Same lint invocation as before, just its own job.
  lint:
    name: "lint:go"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.12.2
          args: --timeout=5m

  security:
    name: "scan:vuln"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.8 ./...

  release-config:
    name: "release:config"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      # releasectl self-validation (build + unit tests) + goreleaser check +
      # changelog-check: cheap, so it runs on every PR (unlike
      # release-snapshot below, which builds real multi-arch archives).
      - name: Release config validation
        run: make release-validate release-check

      # Offline workflow<->tool contract guard (fragment layout, gh api
      # HTTP method, changie's actual output filename). Cheap, so it runs
      # on every PR alongside the checks above.
      - name: Release contract check
        run: make release-contract-check

  release-snapshot:
    name: "release:snapshot"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Kept as its own job (not folded into `quality`) so the fast jobs
      # aren't slowed down by a real 4-platform GoReleaser snapshot build.
      - name: Release snapshot
        run: make release-snapshot
